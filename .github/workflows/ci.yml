name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r companion/requirements.txt
      - run: python -m unittest discover -s companion/tests -v
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File companion/build_desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/MagpieDisplay.exe
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.2.0
      - run: pio run -e magpie-esp32
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            .pio/build/magpie-esp32/firmware.bin
            .pio/build/magpie-esp32/bootloader.bin
            .pio/build/magpie-esp32/partitions.bin
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/preview_magpie_dashboard.py
      - run: python tools/check_docs.py
