[platformio]
default_envs = magpie-esp32

[env:magpie-esp32]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<magpie/>
build_flags =
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT8
  -D LOAD_GFXFF
